name: Daily AI News Digest

on:
  schedule:
    # 22:00 UTC = 07:00 JST / 10:00 UTC = 19:00 JST
    - cron: '0 22,10 * * *'
  workflow_dispatch:

# gh-pages ブランチと data/ への push が要る
permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect articles
        id: collect
        # 収集が0件でもワークフローは落とさない（scripts 側は 0 件なら既存 JSON を上書きしない）。
        # さらに収集が例外で落ちた場合でも continue-on-error でサイトのビルド・デプロイまでは進める。
        # データ更新とデプロイを結合させると、収集の一時的な失敗でサイト全体が更新されなくなる。
        # 失敗した事実は Actions のサマリに残る（ステップが赤くなる）。
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run collect

      - name: Commit data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data/ に変更なし。コミットをスキップする。"
            exit 0
          fi
          git commit -m "chore(data): $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M') JST のダイジェストを更新"
          # 実行中に他の実行や人間が push していると non-fast-forward で落ちるので、
          # リベースして数回試す。
          for attempt in 1 2 3; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push 失敗（$attempt/3）。rebase して再試行する。"
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              continue
            fi
            # rebase が競合したまま先に進むと、未マージのファイル（衝突マーカー入りのJSON）を
            # 抱えた作業ツリーで次の Build が走り、壊れたサイトを公開してしまう。
            # 実際に 2026-08-30 のトップページが「まだダイジェストがありません」で公開された。
            # 収集し直せば復元できるデータなので、競合したら諦めてリモートの状態に戻す。
            echo "::warning::rebase が競合した。作業ツリーをリモートの状態に戻す（今回の収集分は破棄）。"
            git rebase --abort || true
            git reset --hard "origin/${GITHUB_REF_NAME}"
            break
          done
          echo "::warning::data/ の push に失敗した。デプロイは続行する。"
          echo "changed=false" >> "$GITHUB_OUTPUT"

      # 壊れた作業ツリーからサイトを公開しないための門。
      # data/*.json を全件パースするので、衝突マーカー入りや破損したJSONがあればここで落ちる。
      - name: Validate data before build
        run: |
          if [ -n "$(git ls-files --unmerged)" ]; then
            echo "::error::作業ツリーに未マージのファイルが残っている。ビルドを中止する。"
            git ls-files --unmerged
            exit 1
          fi
          npm run repair

      - name: Build site
        env:
          # プロジェクトサイト（https://<owner>.github.io/<repo>/）に置くため basePath が要る。
          # ユーザー/組織サイト（<owner>.github.io リポジトリ）で公開する場合は空文字にすること。
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # 第三者アクションをタグ参照している。contents: write を持つジョブなので、
      # 本番運用に入れる前にコミット SHA でピンすること（タグは差し替えられる）。
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.sha }}'
